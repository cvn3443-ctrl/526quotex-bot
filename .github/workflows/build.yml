name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle
      run: |
        # تثبيت Gradle إذا لم يكن موجوداً
        if [ ! -f ./gradlew ]; then
          wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
          unzip -q gradle-7.5.1-bin.zip
          export PATH=$PATH:$(pwd)/gradle-7.5.1/bin
        else
          chmod +x ./gradlew
        fi
        # بناء التطبيق
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quotex-bot
        path: app/build/outputs/apk/debug/*.apk
