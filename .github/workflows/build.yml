name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          openjdk-17-jdk \
          build-essential

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK with correct structure
      run: |
        # تنظيف أي مجلدات سابقة
        rm -rf ~/.buildozer/android/platform/android-sdk
        
        # إنشاء المجلدات بالهيكل المطلوب من Buildozer
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_SDK_ROOT
        cd $ANDROID_SDK_ROOT
        
        # تحميل command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        rm commandlinetools-linux-11076708_latest.zip
        
        # بناء الهيكل الذي يبحث عنه Buildozer بالضبط
        # Buildozer يتوقع: android-sdk/tools/bin/sdkmanager
        mkdir -p tools/bin
        cp cmdline-tools/bin/sdkmanager tools/bin/sdkmanager
        cp cmdline-tools/bin/avdmanager tools/bin/avdmanager
        chmod +x tools/bin/sdkmanager
        chmod +x tools/bin/avdmanager
        
        # أيضاً ضع نسخة في المسار الجديد (للتوافق)
        mkdir -p cmdline-tools/latest/bin
        cp cmdline-tools/bin/* cmdline-tools/latest/bin/ 2>/dev/null || true
        
        # إضافة إلى المسار
        export PATH=$PATH:$ANDROID_SDK_ROOT/tools/bin
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin
        
        # قبول التراخيص
        yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        
        # تثبيت الأدوات المطلوبة
        $ANDROID_SDK_ROOT/tools/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" > /dev/null 2>&1 || true

    - name: Build with Buildozer
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/tools/bin
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quotex-bot
        path: bin/*.apk
