name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer (inside Docker)
      run: |
        # تجاوز التحذير root
        export FORCE_BUILD=1
        buildozer android debug
      env:
        FORCE_BUILD: 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quotex-bot
        path: bin/*.apk
